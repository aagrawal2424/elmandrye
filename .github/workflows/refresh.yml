name: Monthly Article Refresh

on:
  schedule:
    - cron: "0 15 1 * *"   # 1st of every month, 15:00 UTC
  workflow_dispatch: {}     # manual trigger, no inputs

jobs:
  refresh-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s scripts/content_engine/requirements.txt ]; then
            pip install -r scripts/content_engine/requirements.txt
          fi

      - name: Write .env from secrets
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          cat > .env <<EOF
          SHOPIFY_STORE=${SHOPIFY_STORE:-elmandrye.myshopify.com}
          SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
          SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
          SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2025-01}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
          EOF

      - name: Run article refresh
        run: python scripts/content_engine/refresh.py

      - name: Commit state.json updates
        run: |
          git config user.name "elmandrye-content-bot"
          git config user.email "bot@elmandrye.com"
          git add scripts/content_engine/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "[bot] article refresh state $(date -u +%Y-%m-%d)"
            git push
          fi
