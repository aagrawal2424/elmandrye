name: Daily Content Engine

on:
  # Mon-Fri at 14:00 UTC = 9am EST / 10am EDT.
  schedule:
    - cron: "0 14 * * 1-5"
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish-daily-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed for the state.json auto-commit at end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps + Pillow (for video slide rendering)
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          if [ -s scripts/content_engine/requirements.txt ]; then
            pip install -r scripts/content_engine/requirements.txt
          fi

      - name: Install ffmpeg (for video summary compositing)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Preflight — require image provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
        run: |
          # Hero pipeline needs at minimum OpenAI; warn if fallback providers
          # are absent (we want at least one fallback so a single key rotation
          # doesn't break the day).
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is empty — hero pipeline cannot start. Set it in repo secrets."
            exit 1
          fi
          fallback_count=0
          [ -n "$REPLICATE_API_TOKEN" ] && fallback_count=$((fallback_count+1))
          [ -n "$STABILITY_API_KEY" ] && fallback_count=$((fallback_count+1))
          if [ "$fallback_count" -eq 0 ]; then
            echo "::warning::No fallback image providers configured (REPLICATE_API_TOKEN, STABILITY_API_KEY). One OpenAI hiccup will block today's publish."
          else
            echo "OpenAI present; $fallback_count fallback provider(s) configured."
          fi

      - name: Write .env from secrets
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          cat > .env <<EOF
          SHOPIFY_STORE=${SHOPIFY_STORE:-elmandrye.myshopify.com}
          SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
          SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
          SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2025-01}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1}
          REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
          STABILITY_API_KEY=${STABILITY_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
          ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-EXAVITQu4vr4xnSDxMaL}
          EOF

      - name: Run content engine
        env:
          CONTENT_ENGINE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/content_engine/main.py

      - name: Commit state.json updates
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "elmandrye-content-bot"
          git config user.email "bot@elmandrye.com"
          git add scripts/content_engine/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "[bot] daily content engine state $(date -u +%Y-%m-%d)"
            git push
          fi
