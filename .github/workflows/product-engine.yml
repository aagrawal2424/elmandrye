name: Daily Product Engine

on:
  schedule:
    # Every day at 15:00 UTC = 10am EST / 11am EDT
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without creating products"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  create-draft-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/product_engine/requirements.txt

      - name: Preflight — require source-chain secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: |
          # Hard requirements — without these the engine literally cannot
          # produce a draft product. Anthropic for the research step,
          # OpenAI for the product image.
          missing=""
          [ -z "$OPENAI_API_KEY" ]    && missing="$missing OPENAI_API_KEY"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Required secret(s) empty:$missing"
            exit 1
          fi
          # Soft requirement — without Ahrefs the chain still works via
          # PubMed + reserve, but the highest-signal source is dark.
          if [ -z "$AHREFS_API_KEY" ]; then
            echo "::warning::AHREFS_API_KEY empty — falling back to PubMed + curated reserve only"
          else
            echo "Ahrefs key present — full source chain enabled."
          fi

      - name: Write .env from secrets
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          EXPLODING_TOPICS_API_KEY: ${{ secrets.EXPLODING_TOPICS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > .env <<EOF
          SHOPIFY_STORE=${SHOPIFY_STORE:-elmandrye.myshopify.com}
          SHOPIFY_CLIENT_ID=${SHOPIFY_CLIENT_ID}
          SHOPIFY_CLIENT_SECRET=${SHOPIFY_CLIENT_SECRET}
          SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2025-01}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1}
          AHREFS_API_KEY=${AHREFS_API_KEY}
          EXPLODING_TOPICS_API_KEY=${EXPLODING_TOPICS_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          EOF

      - name: Run product engine
        env:
          PRODUCT_ENGINE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m scripts.product_engine.main

      - name: Commit state.json updates
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "elmandrye-product-bot"
          git config user.email "bot@elmandrye.com"
          git add scripts/product_engine/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "[bot] product engine state $(date -u +%Y-%m-%d)"
            git push
          fi
