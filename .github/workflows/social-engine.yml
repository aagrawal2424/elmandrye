name: Daily Social Posts

on:
  schedule:
    - cron: "0 16 * * *"  # noon ET — generate + email for review
  workflow_dispatch:
    inputs:
      mode:
        description: "generate (make video) or publish (post approved video)"
        required: true
        default: "generate"
        type: choice
        options: [generate, publish]
      video_url:
        description: "Video URL to post (publish mode only)"
        required: false
        default: ""
      captions:
        description: "Captions JSON (publish mode only)"
        required: false
        default: "{}"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run social engine
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: elmandrye.myshopify.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode || 'generate' }}"
          if [ "$MODE" = "publish" ]; then
            python -m social_engine.main publish \
              --video-url "${{ github.event.inputs.video_url }}" \
              --captions '${{ github.event.inputs.captions }}'
          else
            python -m social_engine.main generate
          fi
        working-directory: scripts
